plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'org.minecraft.eden.Eden'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    testImplementation("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.11.4")
    testImplementation("org.mockito:mockito-core:5.15.2")
}

tasks.register('teamServiceTest', Exec) {
    dependsOn testClasses
    def runtimeClasspath = configurations.testRuntimeClasspath
    inputs.files(sourceSets.main.output, sourceSets.test.output, runtimeClasspath)
    commandLine 'java',
            '-cp',
            "build/classes/java/test${File.pathSeparator}build/classes/java/main${File.pathSeparator}build/resources/main${File.pathSeparator}${runtimeClasspath.asPath}",
            'TeamServiceBehaviorChecks'
}

tasks.register('gameplayTest', Exec) {
    dependsOn testClasses
    def runtimeClasspath = configurations.testRuntimeClasspath
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    commandLine launcher.get().executablePath.asFile.absolutePath, '-cp',
            "build/classes/java/test${File.pathSeparator}build/classes/java/main${File.pathSeparator}build/resources/main${File.pathSeparator}${runtimeClasspath.asPath}",
            'GameplayBehaviorChecks'
}

test { failOnNoDiscoveredTests = false }
tasks.named('check') { dependsOn 'teamServiceTest', 'gameplayTest' }

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21.11")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
