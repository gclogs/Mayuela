# Mayuela 메시지 설정
#
# 이 파일은 최초 실행 시 plugins/Mayuela/messages.yml 로 한 번 복사됩니다.
# 플러그인은 서버 시작 또는 /game reload 시점에만 이 파일을 읽습니다.
# 실행 중 이 파일을 다시 저장하지 않으므로, 운영자가 참고할 주석이 유지됩니다.
#
# 색상 별칭:
#   <text>      기본 글자색
#   <highlight> 강조 문구
#   <value>     플레이어 이름, 숫자, 변수 값
#   <success>   성공, 획득, 긍정 상태
#   <info>      아이템 이름 또는 일반 정보
#   <danger>    실패, 경고, 비용, 위험 값
#
# 아래 colors 섹션의 HEX 값을 바꿀 수 있습니다.
# 특정 메시지에서만 직접 HEX 색상을 쓰고 싶다면 MiniMessage HEX 태그를 사용할 수 있습니다.
#   <#FFE08A>원하는 색상의 문구</#FFE08A>
#
# 자주 쓰는 MiniMessage 스타일:
#   <bold>굵게</bold>
#   <italic>기울임</italic>
#   <underlined>밑줄</underlined>
#   <strikethrough>취소선</strikethrough>
#   <newline> 줄바꿈
#
# 플레이스홀더:
#   메시지별 변수는 {amount}처럼 중괄호로 작성합니다.
#   동적 값은 일반 텍스트로 삽입되므로, 플레이어 이름이나 아이템 이름에
#   MiniMessage 태그가 들어 있어도 실행되지 않습니다.
#
# 이스케이프:
#   '<' 문자를 그대로 표시하려면 '\<'처럼 작성합니다.
#   중괄호를 일반 문자로 보여주고 싶다면 {amount}, {player}, {count}, {item}처럼
#   실제 플레이스홀더 이름과 겹치지 않게 작성하세요.
#
# YAML 문자열 작성법:
#   한 줄 메시지는 작은따옴표로 감싸는 것을 권장합니다.
#   줄바꿈이나 들여쓰기가 필요한 메시지는 | 를 사용합니다.
#     example: |
#       <text>첫 번째 줄
#         들여쓰기된 두 번째 줄
#
# messages 아래에는 실제 코드가 읽는 메시지 키만 둡니다.
# 코드에서 사용하지 않는 예시용 섹션은 추가하지 않습니다.

colors:
  text: '#FFFFFF'
  highlight: '#FFE08A'
  value: '#E879F9'
  success: '#22C55E'
  info: '#38BDF8'
  danger: '#EF4444'

messages:
  common:
    player-only: '<text>플레이어만 사용할 수 있습니다.'
    no-permission: '<text>권한이 없습니다.'

  game:
    started: '<highlight>게임이 시작되었습니다.'
    ready-entered: '<highlight>게임</highlight><text> 준비 세션에 진입했습니다. {mode} 색상: {color}</text>'

  lobby:
    registered: '<text>로비를 등록했습니다.'

  join:
    unavailable-now: '<text>현재는 입장할 수 없습니다.'
    already-joined: '<text>이미 </text><highlight>게임</highlight><text>에 입장해 있습니다. 현재 참가자 </text><value>{count}명</value>'
    ready: '<highlight>게임</highlight><text>에 입장했습니다. 상태: </text><success>준비</success>'
    full: '<text>입장할 수 없습니다. 정원이 가득 찼습니다.'
    participant-joined: '<value>{player}님이 </value><highlight>게임</highlight><text>에 입장했습니다. 현재 참가자 </text><value>{count}/{max}명</value>'

  leave:
    unavailable-while-playing: '<highlight>게임 중에는 퇴장할 수 없습니다. 게임 종료 후 다시 시도하세요.'
    not-participating: '<text>현재 </text><highlight>게임</highlight><text>에 참가 중이 아닙니다.</text>'
    ready-cancelled: '<success>준비</success><text>가 취소되었습니다. 현재 참가자 </text><value>{count}명</value>'
    participant-left-ready: '<value>{player}님이 </value><success>준비</success><text>를 취소했습니다. 현재 참가자: </text><value>{count}명</value>'

  shop:
    unavailable: '<highlight>게임 진행 중 </highlight><text>참가자만 상점을 열 수 있습니다.'
    knockback-stick-limit: '<info>[밀치기 막대기]</info><text>는 최대 </text><value>{limit}</value><text>개까지만 보유할 수 있습니다.</text>'
    knockback-stick-same-team: '<text>같은 팀 플레이어에게는 </text><info>밀치기 막대기</info><text>를 사용할 수 없습니다.</text>'
    not-enough-coins: '<text>코인이 부족합니다. 필요 코인: </text><danger>{price}</danger>'
    purchased: '<value>{item}을(를) 구매했습니다. </value><danger>-{price} 코인</danger>'

  altar:
    beacon-gui-blocked: '<highlight>게임 중에는 신호기 GUI를 열 수 없습니다. 제단 설치기로 신호기를 클릭하면 제단을 설치할 수 있습니다.'
    ready-block-place-blocked: '<text>READY 세션에서는 블록을 설치할 수 없습니다.'
    playing-direct-block-place-blocked: '<highlight>게임 중에는 직접 블록을 설치할 수 없습니다. 제단 설치기로 신호기를 클릭하세요.'
    must-be-above-beacon: '<text>제단 색유리는 신호기 바로 위에만 설치할 수 있습니다.'
    capture-failed: '<value>{reason}</value>'
    blocked-above: '<text>신호기 위에 다른 블록이 있어 제단을 설치할 수 없습니다.'
    block-broken: '<text>플레이어의 제단 색유리를 파괴했습니다.'

  respawn:
    freeze-start: '<highlight>게임 스폰에서 부활합니다. </highlight><value>{seconds}</value><text>초 동안 움직일 수 없습니다.</text>'
    can-move-now: '<text>이제 움직일 수 있습니다.'

  bounty:
    same-team-no-reward: '<text>같은 팀 현상수배 처치로는 보상을 받을 수 없습니다.'
    already-rewarded: '<value>{victim}님의 현상수배 보상은 이미 지급되었습니다.'
    reward-inventory-full: '<text>인벤토리에 공간이 없어 현상수배 보상 코인을 받을 수 없습니다.'
    reward-granted: '<text>현상수배 보상으로 코인 {amount}개를 획득했습니다: {victim}'
    reward-paid-to-victim: '<text>현상수배 보상이 지급되었습니다. 이후 당신을 처치해도 추가 보상은 지급되지 않습니다.'

  session:
    participant-quit-recoverable: '<value>{player}님이 접속을 종료했습니다. 게임 상태는 재접속 시 복구됩니다. 현재 참가자 </value><value>{count}명</value>'
    participant-quit-removed: '<value>{player}님이 서버를 나가 </value><highlight>게임 참가자</highlight><text>에서 제외되었습니다. 현재 참가자 </text><value>{count}명</value>'

  coin:
    inventory-full: '<text>인벤토리에 코인을 받을 공간이 없습니다.'
    picked-up: '<text>코인 </text><success>+{amount}개</success><text>를 획득했습니다.</text>'

  buff:
    strength-granted: '<text>제단을 설치할 때까지 </text><danger>힘 </danger><text>버프가 적용됩니다.</text>'
